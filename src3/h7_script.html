  var src = document.querySelector('#'+srcFrameId+' .cloneable');

  if(!src || !holder) return;
  var node = src.cloneNode(true);
  node.classList.add('dark');
  var tag = node.querySelector('.ptag');
  if(tag) tag.innerHTML = '<i class="d"></i> ' + tagText;
  holder.appendChild(node);
}

const order = Array.from(document.querySelectorAll('.nav button[data-goto]')).map(b => b.dataset.goto);
const fa = n => Number(n).toLocaleString('fa-IR');

document.querySelectorAll('.frame').forEach(sec => {
  const duo = sec.querySelector('.duo');
  if (duo) {
    const fh = document.createElement('div');
    fh.className = 'fhead';
    fh.innerHTML = '<div class="kick">' + (sec.dataset.kick || '') + '</div>'
      + '<h1>' + (sec.dataset.title || '') + '</h1>'
      + '<p>' + (sec.dataset.desc || '') + '</p>';
    sec.insertBefore(fh, duo);

    const cfg = NOTES[sec.id];
    if (cfg) {
      let aside = duo.querySelector('aside.notes');
      if (!aside) { aside = document.createElement('aside'); aside.className = 'notes'; duo.appendChild(aside); }
      const h3 = document.createElement('h3');
      h3.innerHTML = '🔎 یادداشت طراحی · ' + fa(cfg.items.length) + ' مورد';
      const ol = document.createElement('ol');
      cfg.items.forEach((it, i) => {
        const li = document.createElement('li');
        if (it.hot) li.classList.add('hot');
        li.innerHTML = '<span class="n">' + fa(i + 1) + '</span><span>' + it.t + '</span>';
        ol.appendChild(li);
      });
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = cfg.who;
      aside.innerHTML = '';
      aside.append(h3, ol, who);
    }
  }

  const idx = order.indexOf(sec.id);
  const pg = document.createElement('div');
  pg.className = 'row';
  pg.style.marginTop = '6px';
  const prev = order[idx - 1], next = order[idx + 1];
  pg.innerHTML = (prev ? '<button class="tbtn" data-goto="' + prev + '">→ فریم قبلی</button>' : '')
    + (next ? '<button class="tbtn" data-goto="' + next + '">فریم بعدی ←</button>' : '')
    + '<span class="cap muted" style="margin-inline-start:auto">فریم ' + fa(idx + 1) + ' از ' + fa(order.length) + '</span>';
  sec.appendChild(pg);
});

function show(id, push) {
  const target = document.getElementById(id) ? id : order[0];
  document.querySelectorAll('.frame').forEach(f => f.classList.toggle('on', f.id === target));
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.goto === target));
  if (push && location.hash !== '#' + target) { try { history.replaceState(null, '', '#' + target); } catch (e) {} }
  window.scrollTo({ top: 0, behavior: 'auto' });
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go) { show(go.dataset.goto, true); return; }
  const ctrl = e.target.closest('[data-ctrl]');
  if (ctrl) {
    const k = ctrl.dataset.ctrl;
    if (k === 'notes') {
      const hidden = document.body.classList.toggle('hidenotes');
      ctrl.setAttribute('aria-pressed', String(!hidden));
      ctrl.textContent = hidden ? '📝 انوتیشن‌ها' : '📝 پنهان‌کردن';
    }
    if (k === 'print') window.print();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  const cur = order.findIndex(id => document.getElementById(id) && document.getElementById(id).classList.contains('on'));
  if (e.key === 'ArrowLeft' && cur < order.length - 1) show(order[cur + 1], true);
  if (e.key === 'ArrowRight' && cur > 0) show(order[cur - 1], true);
});
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
show(location.hash.slice(1) || order[0], false);
</script>
